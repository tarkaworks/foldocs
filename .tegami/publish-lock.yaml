core:changelogs:
  - content: "---\npackages:\n  npm:@foldocs/ai:\n    type: minor\n  npm:@foldocs/asyncapi:\n    type: minor\n  npm:@foldocs/basehub:\n    type: minor\n  npm:@foldocs/cli:\n    type: patch\n  npm:@foldocs/content:\n    type: patch\n  npm:@foldocs/epub:\n    type: minor\n  npm:@foldocs/language:\n    type: patch\n  npm:@foldocs/mdx-remote:\n    type: minor\n  npm:@foldocs/obsidian:\n    type: minor\n  npm:@foldocs/openapi:\n    type: minor\n  npm:@foldocs/python:\n    type: minor\n  npm:@foldocs/sanity:\n    type: minor\n  npm:@foldocs/search:\n    type: patch\n  npm:@foldocs/search-algolia:\n    type: minor\n  npm:@foldocs/search-flexsearch:\n    type: minor\n  npm:@foldocs/search-mixedbread:\n    type: minor\n  npm:@foldocs/search-orama:\n    type: patch\n  npm:@foldocs/search-orama-cloud:\n    type: minor\n  npm:@foldocs/search-trieve:\n    type: minor\n  npm:@foldocs/search-typesense:\n    type: minor\n  npm:@foldocs/typescript:\n    type: minor\n  npm:foldocs-core:\n    type: patch\n  npm:create-foldocs:\n    type: patch\n  npm:foldocs:\n    type: patch\n  npm:foldocs-mdx:\n    type: patch\n  npm:@foldocs/tailwind:\n    type: patch\n  npm:@foldocs/twoslash:\n    type: patch\n  npm:foldocs-ui:\n    type: patch\n  npm:@foldocs/vite:\n    type: patch\n---\n\n## Complete the production documentation surface\n\nPolish the documentation UI, generated templates, and English/Spanish content.\nAdd complete route metadata, static Open Graph images, Schema.org JSON-LD,\ncanonical and alternate links, robots output, and richer sitemaps. Ship typed\ncontent collections, source loaders, reusable MDX includes, synchronized\nTypeScript/JavaScript examples, structured search, provider adapters, OpenAPI\nand AsyncAPI playgrounds, media components, an Effect-native AI integration,\nexpanded translations, and the `add`, `tree`, and `preview` CLI workflows.\nDocument every public npm package with package-specific installation, usage,\ndocumentation, and license information, and expose concise package descriptions\nin npm registry metadata.\n"
    filename: 2026-08-03-x3p7k9vq.md
    v: 0.0.0
