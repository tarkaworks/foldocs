openapi: 3.1.0
info:
  title: Example API
  version: 1.0.0
  description: Replace this example with your OpenAPI document.
servers:
  - url: https://api.example.com
paths:
  /documents/{slug}:
    get:
      operationId: getDocument
      summary: Get a document
      description: Returns one published document by slug.
      tags: [Documents]
      parameters:
        - name: slug
          in: path
          required: true
          description: The document slug.
          schema:
            type: string
      responses:
        "200":
          description: The requested document.
          content:
            application/json:
              schema:
                type: object
                required: [slug, title]
                properties:
                  slug:
                    type: string
                  title:
                    type: string
                  body:
                    type: string
